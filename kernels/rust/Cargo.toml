[package]
name = "mmr-kernels"
version = "0.1.0"
edition = "2024"
# the oldest Rust that builds it: `is_multiple_of` on integers (1.86 fails)
rust-version = "1.87"
description = "Field kernels of magpylib-material-response's face charge and magpylib's cuboid, straight current segment, circular loop, cylinder, sphere and dipole, for the browser (WebAssembly, issue #208)"
license = "BSD-3-Clause"
publish = false

[lib]
name = "mmr_kernels"
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = { version = "1.12.0", optional = true }
wasm-bindgen = { version = "0.2.130", optional = true }

[features]
# observers split over threads (not in the browser)
parallel = ["dep:rayon"]
# the browser build, by wasm-pack
wasm = ["dep:wasm-bindgen"]

[dev-dependencies]
# exact float parsing: one ulp off beside a cuboid edge moves B by 1e-8
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[profile.release]
codegen-units = 1
lto = true

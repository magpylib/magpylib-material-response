[build-system]
requires = ["hatchling>=1.26", "hatch-vcs"]
build-backend = "hatchling.build"


[project]
name = "magpylib-material-response"
authors = [
  { name = "Alexandre Boisselet", email = "alexabois+magpylib@gmail.com" },
]
description = "Python package extending the Magpylib library by providing magnetic field analysis for soft materials and demagnetization of hard magnets."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  # trial: magpylib/magpylib#1059 (chunked, threaded fields) until its release
  "magpylib @ git+https://github.com/magpylib/magpylib@c4781f78bc0cf93bbb7df78073ce5794b49c00c7",
  "loguru>=0.5.0",
  # NumPy's error state is per thread from 2.0; in 1.x it races between
  # threads, and face charge, which runs on threads, warned of divisions it
  # had told NumPy to ignore. 2.0.0 gave np.unique(..., axis=0) a 2-D inverse
  # (85 tests fail); 2.0.1 took it back
  "numpy>=2.0.1",
  "scipy>=1.17.1",  # as magpylib 6.1
]

[project.optional-dependencies]
tetgen = ["tetgen>=0.8.3"]
# finite elements, to check the method of moments (magpylib_material_response.fem)
fem = ["ngsolve>=6.2.2608"]

[project.urls]
Homepage = "https://github.com/magpylib/magpylib-material-response"
"Bug Tracker" = "https://github.com/magpylib/magpylib-material-response/issues"
Discussions = "https://github.com/magpylib/magpylib-material-response/discussions"
Changelog = "https://github.com/magpylib/magpylib-material-response/releases"


[dependency-groups]
test = [
  "pytest >=9",
  "pytest-cov >=7",
  "magpylib-material-response[tetgen,fem]",
]
dev = [
  { include-group = "test" },
]
docs = [
  "pydata-sphinx-theme",
  "sphinx>=7.0",
  "myst_nb>=1.4",
  "sphinx_copybutton",
  "sphinx_autodoc_typehints",
  "pandas",
  "plotly>=6.7",
  "magpylib-material-response[tetgen,fem]",
  # 3D views with field lines, saved into the pages; 0.7.1 draws unsolved soft
  # parts in the neutral colour.
  "magpylib-studio[widget]>=0.7.1",
]

[tool.hatch]
metadata.allow-direct-references = true
version.source = "vcs"
build.hooks.vcs.version-file = "src/magpylib_material_response/_version.py"

[tool.hatch.envs.default]
dependency-groups = ["dev"]

[tool.hatch.envs.hatch-test]
dependency-groups = ["test"]
env-vars.PYTHONWARNDEFAULTENCODING = "1"


[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals"]
strict = true
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
filterwarnings = [
  "error",
]
log_level = "INFO"
testpaths = [
  "tests",
]
# validation/, the cases and methods that tests/test_validation.py checks
pythonpath = ["."]


[tool.coverage]
run.source = ["magpylib_material_response"]
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "magpylib_material_response.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true


[tool.ruff]
show-fixes = true

[tool.ruff.lint]
extend-select = [
  "ARG",    # flake8-unused-arguments
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "EM",     # flake8-errmsg
  "EXE",    # flake8-executable
  "FURB",   # refurb
  "G",      # flake8-logging-format
  "ICN",    # flake8-import-conventions
  "ISC",    # flake8-implicit-str-concat
  "LOG",    # flake8-logging
  "NPY",    # NumPy specific rules
  "PD",     # pandas-vet
  "PERF",   # perflint
  "PGH",    # pygrep-hooks
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific
  "SIM",    # flake8-simplify
  "SLOT",   # flake8-slots
  "T10",    # flake8-debugger
  "T20",    # flake8-print
  "TC",     # flake8-type-checking
  "TRY",    # tryceratops
  "UP",     # pyupgrade
]
ignore = [
  "PLR09",    # Too many <...>
  "PLR2004",  # Magic value used in comparison
]
# Uncomment if using a _compat.typing backport
# typing-modules = ["magpylib_material_response._compat.typing"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"scripts/**" = ["T20"]
"validation/**" = ["T20"]
"noxfile.py" = ["T20", "EXE001"]


[tool.pylint]
py-version = "3.11"
ignore-paths = [".*/_version.py"]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
# compiled modules that pylint cannot inspect; the fem extra, not installed here
ignored-modules = ["netgen", "ngsolve"]
messages_control.disable = [
  "design",
  "fixme",
  "line-too-long",
  "missing-module-docstring",
  "missing-function-docstring",
  "wrong-import-position",
  "invalid-name", # TODO - review later
  "protected-access", # TODO - review later
]


[tool.codespell]
# netgen's name for a face's inner region (FaceDescriptor.domin)
ignore-words-list = "domin"

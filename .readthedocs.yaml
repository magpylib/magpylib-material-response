# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    build:
      # the default command, one notebook at a time: with -j 2 two of the
      # heaviest (up to 3.3 GB each) could run side by side, and from
      # 2026-11-08 builds hung at the 15-minute limit now and then
      html:
        - uv run --no-sync --no-dev sphinx-build -T -b html -d _build/doctrees
          -D language=en docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

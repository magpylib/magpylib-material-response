# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    build:
      # in the background, waited for in steps under 5 minutes: a single
      # command over 5 minutes never reported back (docs/rtd_build.sh)
      html:
        - bash docs/rtd_build.sh start
        - bash docs/rtd_build.sh wait 240
        - bash docs/rtd_build.sh wait 240
        - bash docs/rtd_build.sh last 240

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    build:
      # the default command, with -j 2 (the builder has 2 CPUs), run in the
      # background and waited for in short steps: see docs/rtd_build.sh. The
      # last step shows the warnings and the end of the log
      html:
        - bash docs/rtd_build.sh start
        - bash docs/rtd_build.sh wait 240
        - bash docs/rtd_build.sh wait 240
        - bash docs/rtd_build.sh last 240

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    build:
      # the default command, with -j 2: the builder has 2 CPUs, and two
      # notebooks running side by side keep the build under five minutes
      html:
        - uv run --no-sync --no-dev sphinx-build -j 2 -T -b html -d
          _build/doctrees -D language=en docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

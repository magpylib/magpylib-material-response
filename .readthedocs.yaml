# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    build:
      # the default command, with -j 2: the builder has 2 CPUs, and two
      # notebooks running side by side keep the build under five minutes
      # DIAGNOSTIC, not to merge: the build in the background, reported on
      # every few minutes by commands that end and so keep their log
      html:
        - bash docs/rtd_probe.sh start
        - bash docs/rtd_probe.sh report 180
        - bash docs/rtd_probe.sh report 180
        - bash docs/rtd_probe.sh report 180
        - bash docs/rtd_probe.sh report 120
        - bash docs/rtd_probe.sh wait

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

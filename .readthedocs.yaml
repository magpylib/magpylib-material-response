# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    build:
      # the default command, one notebook at a time, stopped after 12 min so
      # that a stalled build still saves its log (the builder's limit is 15
      # min, and a build it stops saves nothing): from 2026-11-08 builds
      # stalled at that limit now and then
      html:
        - timeout 720 uv run --no-sync --no-dev sphinx-build -T -b html -d
          _build/doctrees -D language=en docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

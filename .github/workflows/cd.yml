name: CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3

jobs:
  dist:
    name: Distribution build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # the browser's field kernels (#208), package data in an ignored folder
      # that pyproject.toml's artifacts take into both distributions
      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build the browser's field kernels
        working-directory: kernels/rust
        run: |
          wasm-pack build --release --target web --out-dir pkg -- --features wasm
          mkdir -p ../../src/magpylib_material_response/kernels
          cp pkg/mmr_kernels.js pkg/mmr_kernels_bg.wasm ../../src/magpylib_material_response/kernels/

      - uses: hynek/build-and-inspect-python-package@v3.0.2
        id: baipp

      # a release without them would load in a page as no kernels at all
      - name: Check the field kernels ship
        env:
          DIST: ${{ steps.baipp.outputs.dist }}
        run: |
          expected=$'magpylib_material_response/kernels/mmr_kernels.js\nmagpylib_material_response/kernels/mmr_kernels_bg.wasm'
          diff <(echo "$expected") <(unzip -Z1 "$DIST"/*.whl | grep '^magpylib_material_response/kernels/' | sort)
          diff <(echo "$expected") <(tar -tzf "$DIST"/*.tar.gz | grep -o 'magpylib_material_response/kernels/.*[^/]$' | sort)

      # The Agent Skill is package data in a dot-directory; check that both
      # distributions carry every file of it.
      - name: Check the Agent Skill ships
        env:
          DIST: ${{ steps.baipp.outputs.dist }}
        run: |
          expected=$(cd src && find magpylib_material_response/.agents -type f | sort)
          diff <(echo "$expected") <(unzip -Z1 "$DIST"/*.whl | grep '^magpylib_material_response/\.agents/' | sort)
          diff <(echo "$expected") <(tar -tzf "$DIST"/*.tar.gz | grep -o 'magpylib_material_response/\.agents/.*[^/]$' | sort)

  publish:
    needs: [dist]
    name: Publish to PyPI
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Packages
          path: dist

      - name: Generate artifact attestation for sdist and wheel
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - uses: pypa/gh-action-pypi-publish@release/v1

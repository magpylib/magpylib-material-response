name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Many color libraries just need this variable to be set to any value.
  # Set it to 3 to support 8-bit color graphics (256 colors per channel)
  # for libraries that care about the value set.
  FORCE_COLOR: 3

jobs:
  lint:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: astral-sh/setup-uv@v10.3.3

      - uses: j178/prek-action@v2

      - name: Run Pylint
        run: uvx nox -s pylint -- --output-format=github

  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        runs-on: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install package
        run: uv sync

      # a pull request runs the fast tests here and the slow ones in the job
      # below, side by side; main runs them all here. Ubuntu with Python 3.14
      # holds every test not marked slow to the budget of tests/conftest.py
      - name: Test package
        env:
          MR_TEST_BUDGET:
            ${{ matrix.runs-on == 'ubuntu-latest' && matrix.python-version ==
            '3.14' && '10' || '' }}
          SELECT:
            ${{ github.event_name == 'pull_request' && 'not slow' || 'all' }}
        shell: bash
        run: |
          if [ "$SELECT" = all ]; then marks=(); else marks=(-m "$SELECT"); fi
          uv run pytest -ra --cov --cov-report=xml --cov-report=term --durations=20 "${marks[@]}"

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  slow:
    name: Slow tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install package
        run: uv sync

      - name: Test package
        run: uv run pytest -ra -m slow --durations=20

  bare:
    name: Without the extras
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install package without tetgen and NGSolve
        run: |
          uv venv
          uv pip install . "pytest>=9"

      - name: Test package
        run: >-
          .venv/bin/python -m pytest -ra ${{ github.event_name == 'pull_request'
          && '-m "not slow"' || '' }}

  lowest:
    name: At the lowest pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.3.3

      # our own pins at their floors, the extras' too; what they pull in at its
      # newest, as an install would take it
      - name: Install package at its lowest pins
        run: |
          uv venv
          uv pip install --resolution lowest-direct ".[tetgen,fem]" "pytest>=9"

      # a floor that a dependency has since raised is no longer tested here,
      # only claimed: name it
      - name: Check that each floor is what was installed
        run: |
          .venv/bin/python - <<'EOF'
          import re
          import sys
          import tomllib
          from importlib.metadata import version

          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          pins = project["dependencies"] + [
              pin for extra in ("tetgen", "fem")
              for pin in project["optional-dependencies"][extra]
          ]
          def parts(v):
              release = re.match(r"\d+(\.\d+)*", v).group()  # 6.0 == 6.0.0
              return (*map(int, release.split(".")), 0, 0, 0)[:4]
          off = []
          for pin in pins:
              found = re.fullmatch(r"([\w.-]+)(?:\[[^]]*\])?>=([\d.]+)", pin.replace(" ", ""))
              if found:
                  name, floor = found.groups()
                  print(f"{name} >= {floor}: {version(name)}")
                  if parts(version(name)) != parts(floor):
                      off.append(f"{name}: pinned >= {floor}, the lowest that installs is {version(name)}")
          sys.exit("\n".join(off) or None)
          EOF

      - name: Test package
        run: >-
          .venv/bin/python -m pytest -ra ${{ github.event_name == 'pull_request'
          && '-m "not slow"' || '' }}

  docs:
    name: Docs, within their time budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install the docs group
        run: uv sync --group docs

      # the build of .readthedocs.yaml, with a live log, which Read the Docs
      # does not keep for a build it stops at its 15 minutes
      - name: Build the docs
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          uv run --no-sync --no-dev sphinx-build -j 2 -T -b html -d _build/doctrees -D language=en docs _build/html 2>&1 | tee docs-build.log

      - name: Check the time budget
        run: python docs/check_budget.py docs-build.log

  pass:
    if: always()
    needs: [lint, checks, slow, bare, lowest, docs]
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          # the slow tests run in their own job on a pull request only
          allowed-skips: slow
          jobs: ${{ toJSON(needs) }}
